buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}


version = '1.3.0'
group = 'net.erutobusiness'
base { archivesName = 'eo_scanguard' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}


dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // Mixin のターゲット解決用。実行時は同梱しない（利用者が入れている OELib に当てる）
    compileOnly files('libs/oelib.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'eo_scanguard',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'OELib Scan Guard',
            'Implementation-Version': project.version,
        ])
    }
}
